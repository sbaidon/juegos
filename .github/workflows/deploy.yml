name: Deploy to GitHub Pages

# The site is served from the gh-pages branch.
# This copies main onto it after every push, and GitHub then rebuilds the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish main to gh-pages
        run: git push --force origin HEAD:gh-pages
