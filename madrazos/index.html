<style>
/* Layout idea: the menu is a cartel de baile (fluorescent paper, heavy black type);
   the fight is a full-bleed 16:9 arena with thumb controls under or over it. */
:root {
  color-scheme: light;
  --fluo-yellow: #ffe500;
  --fluo-orange: #ff8a00;
  --fluo-pink: #ff2e88;
  --ink: #15110d;
  --paper: #fff9e3;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Chivo", "Helvetica Neue", Arial, sans-serif;
  --hard: 5px 5px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(172deg, var(--fluo-yellow) 0%, var(--fluo-yellow) 22%, var(--fluo-orange) 60%, var(--fluo-pink) 100%) fixed;
  background-color: var(--fluo-orange);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
}
#menu { max-width: 520px; margin: 0 auto; padding: 20px 18px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(38px, 12.5vw, 66px); line-height: 1.02; letter-spacing: -0.01em; }
.pop { color: var(--paper); white-space: nowrap; text-shadow: 4px 4px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
p { margin: 0; }
.kicker { font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; border-top: 4px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 6px 0; display: flex; justify-content: space-between; gap: 12px; }
.lead { font-size: 19px; font-weight: 700; }
.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--hard); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em; }
.dark { background: var(--ink); color: var(--fluo-yellow); }
.dark b { color: var(--paper); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { font-family: var(--font-display); text-transform: uppercase; font-size: 20px; line-height: 1.1; background: var(--ink); color: var(--fluo-yellow); border: 3px solid var(--ink); padding: 16px 18px; width: 100%; box-shadow: 5px 5px 0 var(--paper); }
.btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--paper); }
.btn.alt { background: var(--paper); color: var(--ink); box-shadow: var(--hard); }
.btn.small { font-size: 15px; padding: 10px 12px; width: auto; }
:focus-visible { outline: 4px solid var(--fluo-pink); outline-offset: 2px; }
.chip { border: 3px solid var(--ink); background: transparent; padding: 8px 12px; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--fluo-yellow); }
.roster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fighter { border: 3px solid var(--ink); background: #fff; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.fighter canvas { width: 84px; height: 96px; max-width: 100%; }
.fighter .nm { font-weight: 900; font-size: 13px; line-height: 1.15; }
.fighter .sp { font-size: 11px; line-height: 1.2; }
.fighter[aria-pressed="true"] { background: var(--fluo-yellow); box-shadow: 4px 4px 0 var(--fluo-pink); }
.facebox { display: flex; gap: 12px; align-items: center; }
.facebox canvas { width: 72px; height: 72px; border: 3px solid var(--ink); background: #000; flex: none; }
.file { position: relative; display: inline-block; }
.file input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.file:focus-within .btn { outline: 4px solid var(--fluo-pink); outline-offset: 2px; }
.tx { display: flex; gap: 12px; align-items: flex-start; }
.tx canvas { width: 112px; height: 112px; flex: none; border: 3px solid var(--ink); image-rendering: pixelated; background: #000; }
.tx .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
input.txt { font: inherit; font-weight: 700; padding: 10px 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); border-radius: 0; min-width: 0; width: 100%; }
#code { text-transform: uppercase; letter-spacing: .2em; max-width: 130px; font-family: var(--font-display); }
.status { font-weight: 900; background: var(--ink); color: var(--paper); padding: 8px 12px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { border: 3px solid var(--ink); background: var(--ink); color: var(--fluo-yellow); padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.slot canvas { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; }
.slot .nm { font-weight: 900; font-size: 14px; overflow-wrap: anywhere; }
.slot .sp { font-size: 12px; color: var(--paper); }
.slot.empty { background: transparent; color: var(--ink); border-style: dashed; justify-content: center; align-items: center; min-height: 120px; font-weight: 700; font-size: 14px; }
.code-big { font-family: var(--font-display); font-size: clamp(54px, 20vw, 96px); line-height: 1; letter-spacing: .06em; }
ul.keys { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

#game { position: fixed; inset: 0; background: #0b0908; display: none; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
#game.on { display: flex; }
#wrap { flex: none; display: flex; justify-content: center; position: relative; }
#cv { display: block; }
#controls { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 10px; min-height: 0; }
#game.land #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 14px; align-items: flex-end; pointer-events: none; opacity: .72; }
#game.land #controls > * { pointer-events: auto; }
@media (hover: hover) and (pointer: fine) { #controls { visibility: hidden; } }
#stick { width: 136px; height: 136px; border-radius: 50%; border: 3px solid rgba(255, 249, 227, .6); background: rgba(255, 249, 227, .12); touch-action: none; display: flex; align-items: center; justify-content: center; flex: none; }
#knob { width: 58px; height: 58px; border-radius: 50%; background: var(--fluo-yellow); border: 3px solid var(--ink); pointer-events: none; }
#acts { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: 62px 62px; gap: 8px; }
.act { border-radius: 50%; border: 3px solid var(--paper); background: rgba(255, 249, 227, .16); color: var(--paper); font-family: var(--font-display); font-size: 10px; line-height: 1.05; touch-action: none; padding: 0; text-transform: uppercase; }
.act.on { background: var(--fluo-yellow); color: var(--ink); }
#btn-a { border-color: var(--fluo-yellow); }
#btn-b { border-color: var(--fluo-pink); }
#btn-q { border-color: var(--fluo-orange); }
#topbar { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; z-index: 3; }
#topbar button { background: rgba(21, 17, 13, .7); color: var(--paper); border: 2px solid var(--paper); font-weight: 900; font-size: 12px; padding: 5px 8px; text-transform: uppercase; }
@media (max-width: 520px) { #topbar button { font-size: 9px; padding: 3px 5px; border-width: 1px; } }
#result { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(11, 9, 8, .72); padding: 16px; z-index: 4; overflow: auto; }
#result.on { display: flex; }
#result .panel { max-width: 380px; width: 100%; background: var(--fluo-yellow); }
#result h2 { font-size: clamp(26px, 8vw, 40px); line-height: 1; }
</style>
</head>
<body>
<main id="menu"></main>
<div id="game">
  <div id="wrap">
    <canvas id="cv" width="960" height="540" aria-label="Arena de pelea"></canvas>
    <div id="topbar">
      <button id="btn-full" type="button">Pantalla completa</button>
      <button id="btn-mute" type="button">Sonido</button>
      <button id="btn-exit" type="button">Salir</button>
    </div>
  </div>
  <div id="controls">
    <div id="stick" aria-label="Moverse"><div id="knob"></div></div>
    <div id="acts">
      <button class="act" id="btn-q" data-k="q" type="button">Defi<br>nitiva</button>
      <button class="act" id="btn-s" data-k="s" type="button">Esquive</button>
      <button class="act" id="btn-b" data-k="b" type="button">Especial</button>
      <span></span>
      <button class="act" id="btn-j" data-k="j" type="button">Brinco</button>
      <button class="act" id="btn-a" data-k="a" type="button">Golpe</button>
    </div>
  </div>
  <div id="result"></div>
</div>

      if (d.rivals >= 1 && d.rivals <= 3) cfg.rivals = d.rivals;

    } catch (e) { /* optional */ }
  }
/* ---------- camera ---------- */
  function setMySlot(n) {
    faces = faces.map(function (f) { return f === myFace ? null : f; });
    app.slot = n;
    if (myFace) faces[n] = myFace;
  }
  function startCam() {
    if (cam.on || cam.busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cam.err = "Aquí no se puede usar la cámara."; refresh(); return; }
    cam.busy = true; cam.err = "";
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 320 } }, audio: false }).then(function (st) {

      v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.srcObject = st;
      var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
      cam.video = v; cam.on = true; cam.busy = false;
      myFace = document.createElement("canvas"); myFace.width = 96; myFace.height = 96;
      faces[app.slot] = myFace; refresh();

    G.cut = m.u && G.players[m.u[0] | 0] ? { i: m.u[0] | 0, t: m.u[1] | 0 } : null;
    G.ents = (m.e || []).slice(0, 70).filter(function (a) { return ENT_KINDS.indexOf(a[0]) >= 0; }).map(function (a) {
      return { k: a[0], x: +a[1], y: +a[2], vx: +a[3], vy: +a[4], t: a[5] | 0, o: a[6] | 0, face: a[7] < 0 ? -1 : 1, delay: a[8] ? 1 : 0, life: a[9] | 0, stuck: !!a[10], w: +a[11] || 0, h: +a[12] || 0 };
    });
    G.fx = (m.x || []).slice(0, 60).map(function (a) { return { type: String(a[0]), x: +a[1], y: +a[2], t: +a[3], life: +a[4] || 1, col: typeof a[5] === "string" && /^#[0-9a-f]{6}$/i.test(a[5]) ? a[5] : 0, a: +a[6] || 0 }; });
    (m.n || []).slice(0, 12).forEach(function (a) { tone(+a[0] || 200, Math.min(0.6, +a[1] || 0.1), ["square", "sawtooth", "triangle", "sine"].indexOf(a[2]) >= 0 ? a[2] : "square", Math.min(0.12, +a[3] || 0.05), +a[4] || 0); });
    if (G.over < 0 && G.shown) { G.shown = false; resultEl.classList.remove("on"); }
    if (G.over >= 0 && G.overT >= 130 && !G.shown && G.players[G.over]) { G.shown = true; showResult(); }
  }

  /* ---------- screens ---------- */
  function refresh() { if (G) return; if (app.lobby) renderLobby(); else renderMenu(); }

  function showResult() {
    var p = G.players[G.over], you = !p.bot && p.slot === app.slot;
    var h = '<div class="panel"><h3>' + (you ? "Ganaste" : "Ganó") + "</h3>";
    h += "<h2>" + esc(you ? "¡Viva tú!" : p.name) + "</h2>";
    h += '<p class="lead">"' + esc(p.ch.quotes[0]) + '"</p>';
    h += "<p>" + G.players.map(function (q) { return esc(q.name) + ": " + q.kos + " tumbados"; }).join(" · ") + "</p>";
    if (app.role === "solo") {
      h += '<button class="btn" data-act="rematch" type="button">Revancha</button>';
      h += '<button class="btn alt" data-act="menu" type="button">Cambiar prócer</button>';
    } else if (app.role === "host") {
      h += '<button class="btn" data-act="lobby" type="button">Otra pelea</button>';
      h += '<button class="btn alt" data-act="menu" type="button">Cerrar la sala</button>';
    } else {
      h += "<p><b>Esperando a que el anfitrión arme otra.</b></p>";
      h += '<button class="btn alt" data-act="menu" type="button">Salir de la sala</button>';
    }
    resultEl.innerHTML = h + "</div>"; resultEl.classList.add("on");
    var b = resultEl.querySelector("button"); if (b) b.focus();
  }
  function startFight() {
    audio(); resultEl.classList.remove("on");
    Object.keys(held).forEach(function (k) { held[k] = false; });
    newGame(); game.classList.add("on"); resize(); acc = 0; lastT = performance.now();
  }
  function toMenu() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    if (app.role !== "solo") { leaveRoom(""); return; }
    G = null; game.classList.remove("on"); resultEl.classList.remove("on");
    renderMenu();
  }

  function rosterHTML() {
    var h = '<div class="roster">';
    CHARS.forEach(function (c, i) {
      h += '<button class="fighter" type="button" data-act="ch" data-i="' + i + '" aria-pressed="' + (cfg.ch === i) + '"><canvas width="168" height="192" data-ch="' + i + '"></canvas><span class="nm">' + esc(c.name) + '</span><span class="sp">' + esc(c.sp[0]) + "</span></button>";
    });
    var c = CHARS[cfg.ch];
    return h + '</div><p class="hint"><b>' + esc(c.name) + ".</b> Especial: " + esc(c.sp[0]) + ". Arriba + especial: " + esc(c.sp[1]) + ". Abajo + especial: " + esc(c.sp[2]) + ". <b>Definitiva: " + esc(c.ult) + ".</b></p>";
  }
  function camHTML() {
    var h = "";
    if (!cam.on) h += '<button class="btn alt small" type="button" data-act="cam">' + (cam.busy ? "Prendiendo..." : "Prender mi cámara") + "</button>";
    if (cam.err) h += '<p class="hint"><b>' + esc(cam.err) + "</b></p>";
    return h;
  }
  function stageHTML() {
    var h = '<div class="row">';
    STAGES.forEach(function (s, i) { h += '<button class="chip" type="button" data-act="stage" data-i="' + i + '" aria-pressed="' + (cfg.stage === i) + '">' + esc(s.name) + "</button>"; });
    return h + "</div>";
  }

  function renderMenu() {
    var online = netOK(), h = "";
    h += '<div class="kicker"><span>Pelea de próceres</span><span>Hecho en Chihuahua</span></div>';
    h += '<h1>Madrazos <span class="pop">Patrios</span></h1>';
    h += '<p class="lead">La historia de México, pero a trancazos. Prende tu cámara, escoge tu prócer y tumba a tus compas del escenario.</p>';
    if (app.status) h += '<p class="status" role="alert">' + esc(app.status) + "</p>";
    h += '<section class="panel"><h3>Tu transmisión</h3><div class="tx"><canvas width="96" height="96" data-face="me"></canvas><div class="col">';
    h += '<input class="txt" id="name" maxlength="12" autocomplete="off" placeholder="Tu nombre" aria-label="Tu nombre" value="' + esc(cfg.name) + '">';
    h += camHTML() + "</div></div>";
    h += '<p class="hint">Pon tu cara al centro del cuadro. El juego te pone en vivo el sombrero, el bigote y el color de tu prócer, y así sales en la pelea.</p></section>';
    h += '<section class="panel"><h3>Tu prócer</h3>' + rosterHTML() + "</section>";
    h += '<section class="panel"><h3>Jugar con la raza, hasta 4</h3>';
    if (online) {
      h += '<button class="btn" type="button" data-act="host">Crear sala</button>';
      h += '<div class="row"><input class="txt" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" aria-label="Código de la sala" value="' + esc(joinCode) + '"><button class="btn alt small" type="button" data-act="join">Unirme</button></div>';
    } else {
      h += '<p class="hint"><b>Este navegador no deja conectar con otros jugadores.</b> Prueba con Chrome o Safari actualizado.</p>';
    }
    h += "</section>";
    h += '<section class="panel"><h3>Practicar contra la compu</h3><div class="row">';
    [1, 2, 3].forEach(function (n) { h += '<button class="chip" type="button" data-act="rivals" data-i="' + n + '" aria-pressed="' + (cfg.rivals === n) + '">' + n + (n === 1 ? " rival" : " rivales") + "</button>"; });
    h += "</div>" + stageHTML();
    h += '<button class="btn alt" type="button" data-act="solo">Entrenar</button></section>';
    h += '<section class="panel dark"><h3>Cómo se juega</h3><ul class="keys">';
    h += "<li>Cada golpe sube tu porcentaje. Entre más alto, más lejos vuelas. Pierdes una vida si te sacan del escenario.</li>";
    h += "<li><b>Golpe:</b> tócalo dos veces para el combo. Mantenlo para cargar un trancazo. Con arriba o abajo cambia el golpe.</li>";
    h += "<li><b>Especial:</b> solo, con arriba (te regresa al escenario) o con abajo. Son tres por prócer.</li>";
    h += "<li><b>Esquive:</b> un instante en que nadie te toca.</li>";
    h += "<li><b>Definitiva:</b> pega y aguanta golpes para llenar tu barra. Cuando brille, suéltala.</li>";
    h += "<li><b>Teclado:</b> flechas o WASD para moverte, arriba o espacio brinca, J o Z golpe, K o X especial, L o C esquive, I o V definitiva.</li>";
    h += "<li><b>Control:</b> también jala con control de Xbox o PlayStation. En el cel salen botones en pantalla.</li>";
    h += "</ul></section>";
    menu.innerHTML = h;
    drawRoster();
  }

  function renderLobby() {
    var host = app.role === "host", n = app.lobby.ps.length, h = "";
    h += '<div class="kicker"><span>Sala de espera</span><span>' + n + " de 4</span></div>";
    h += '<div class="code-big">' + esc(app.code) + "</div>";
    h += '<p class="lead">' + (host ? "Pásales este código a tus compas, o mándales el link." : "Ya estás adentro. Escoge tu prócer mientras llegan los demás.") + "</p>";
    if (host) h += '<button class="btn alt small" type="button" data-act="copy">Copiar link de la sala</button>';
    if (app.status) h += '<p class="status" role="status">' + esc(app.status) + "</p>";
    h += '<section class="panel"><h3>En transmisión</h3><div class="slots">';
    for (var s = 0; s < 4; s++) {
      var lp = app.lobby.ps[s];
      if (lp) h += '<div class="slot"><canvas width="96" height="96" data-face="' + lp.slot + '"></canvas><span class="nm">' + esc(lp.name) + (lp.slot === app.slot ? " (tú)" : "") + '</span><span class="sp">' + esc(CHARS[lp.ch].name) + "</span></div>";
      else h += '<div class="slot empty">Esperando compa...</div>';
    }
    h += "</div>" + camHTML() + "</section>";
    h += '<section class="panel"><h3>Tu prócer</h3>' + rosterHTML() + "</section>";
    if (host) {
      h += '<section class="panel"><h3>Escenario</h3>' + stageHTML() + "</section>";
      if (n < 2) h += '<p class="status">Faltan compas. Ocupan ser mínimo 2 para empezar.</p>';
      else h += '<button class="btn" type="button" data-act="start">¡A los madrazos!</button>';
    } else {
      h += '<p class="status" role="status">Esperando a que el anfitrión empiece la pelea.</p>';
    }
    h += '<button class="btn alt small" type="button" data-act="leave">' + (host ? "Cerrar la sala" : "Salir de la sala") + "</button>";
    menu.innerHTML = h;
    drawRoster();
  }

  function drawRoster() {
    menu.querySelectorAll("canvas[data-ch]").forEach(function (c) {
      var i = +c.dataset.ch, x = c.getContext("2d");
      x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height);
      x.setTransform(1.5, 0, 0, 1.5, 76, 184);
      drawFighter(x, { x: 0, y: 0, face: 1, ch: CHARS[i], grounded: true, img: null, frame: 0, move: cfg.ch === i ? "jab2" : null, mt: 8 });
    });
    drawLive();
  }
  function drawLive() {
    var list = menu.querySelectorAll("canvas[data-face]");
    for (var i = 0; i < list.length; i++) {
      var c = list[i], s = c.dataset.face, ch, img;
      if (s === "me") { ch = CHARS[cfg.ch]; img = cam.on ? myFace : null; }
      else { var lp = lobbyEntry(+s); if (!lp) continue; ch = CHARS[lp.ch]; img = faces[lp.slot]; }
      drawPortrait(c.getContext("2d"), c.width, ch, img);
    }
  }

  /* ---------- input: keyboard, touch, gamepad ---------- */
  var KEYS = { ArrowLeft: ["l"], KeyA: ["l"], ArrowRight: ["r"], KeyD: ["r"], ArrowDown: ["d"], KeyS: ["d"], ArrowUp: ["u", "j"], KeyW: ["u", "j"], Space: ["j"],
    KeyJ: ["a"], KeyZ: ["a"], KeyK: ["b"], KeyX: ["b"], KeyL: ["s"], KeyC: ["s"], ShiftLeft: ["s"], ShiftRight: ["s"], KeyI: ["q"], KeyV: ["q"] };
  var down = {}, tc = {};
  function pollInput() {
    var k, c;
    for (k in held) held[k] = false;
    for (c in down) if (down[c] && KEYS[c]) KEYS[c].forEach(function (a) { held[a] = true; });
    for (k in tc) if (tc[k]) held[k] = true;
    try {
      var gps = navigator.getGamepads ? navigator.getGamepads() : [];
      for (var i = 0; i < gps.length; i++) {
        var g = gps[i]; if (!g || !g.connected) continue;
        var ax = g.axes[0] || 0, ay = g.axes[1] || 0, b = function (n) { return !!(g.buttons[n] && g.buttons[n].pressed); };
        if (ax < -0.4 || b(14)) held.l = true; if (ax > 0.4 || b(15)) held.r = true; if (ay < -0.5 || b(12)) held.u = true; if (ay > 0.5 || b(13)) held.d = true;
        if (b(0)) held.j = true; if (b(2)) held.a = true; if (b(1)) held.b = true; if (b(4) || b(5) || b(7)) held.s = true; if (b(3)) held.q = true;
        break;
      }
    } catch (e) { /* no gamepad access here */ }
  }
  window.addEventListener("keydown", function (e) {
    if (!G || resultEl.classList.contains("on") || !KEYS[e.code]) return;
    audio(); down[e.code] = true; e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { down[e.code] = false; });
  window.addEventListener("blur", function () { down = {}; });
  window.addEventListener("resize", resize);

  var stick = document.getElementById("stick"), knob = document.getElementById("knob"), stId = null;
  function stSet(e) {
    var r = stick.getBoundingClientRect(), R = r.width / 2, dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R, len = Math.sqrt(dx * dx + dy * dy);
    if (len > 1) { dx /= len; dy /= len; }
    tc.l = dx < -0.35; tc.r = dx > 0.35; tc.u = dy < -0.55; tc.d = dy > 0.55;
    knob.style.transform = "translate(" + dx * R * 0.6 + "px," + dy * R * 0.6 + "px)";
  }
  function stEnd(e) { if (e.pointerId !== stId) return; stId = null; tc.l = tc.r = tc.u = tc.d = false; knob.style.transform = ""; }
  stick.addEventListener("pointerdown", function (e) { audio(); stId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (x) {} stSet(e); e.preventDefault(); });
  stick.addEventListener("pointermove", function (e) { if (e.pointerId === stId) stSet(e); });
  stick.addEventListener("pointerup", stEnd); stick.addEventListener("pointercancel", stEnd);
  document.querySelectorAll(".act").forEach(function (b) {
    var k = b.dataset.k;
    var off = function () { tc[k] = false; b.classList.remove("on"); };
    b.addEventListener("pointerdown", function (e) { audio(); tc[k] = true; b.classList.add("on"); try { b.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
    b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off);
  });
  game.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.getElementById("btn-exit").addEventListener("click", toMenu);
  document.getElementById("btn-mute").addEventListener("click", function () { cfg.mute = !cfg.mute; this.textContent = cfg.mute ? "Sin sonido" : "Sonido"; save(); audio(); });
  document.getElementById("btn-full").addEventListener("click", function () {
    try {
      var p = game.requestFullscreen ? game.requestFullscreen() : null;
      if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {});
    } catch (e) { /* not allowed here */ }
  });
resultEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (a === "rematch") startFight();
    else if (a === "lobby") { G = null; game.classList.remove("on"); resultEl.classList.remove("on"); tLob = 0; renderLobby(); }
    else toMenu();
  });
  menu.addEventListener("input", function (e) {
    if (e.target.id === "name") { cfg.name = e.target.value.slice(0, 12); save(); }
    else if (e.target.id === "code") joinCode = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  });
  menu.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, i = +b.dataset.i;
    audio();
    if (a === "ch") { cfg.ch = i; var me = app.role === "host" ? lobbyEntry(0) : null; if (me) me.ch = i; }
    else if (a === "rivals") cfg.rivals = i;
    else if (a === "stage") cfg.stage = i;
    else if (a === "cam") { startCam(); }
    else if (a === "host") { save(); app.status = ""; createRoom(); return; }
    else if (a === "join") { save(); joinRoom(joinCode); return; }
    else if (a === "solo") { save(); app.status = ""; startCam(); startFight(); return; }
    else if (a === "start") { if (app.role === "host" && app.lobby.ps.length >= 2) startFight(); return; }
    else if (a === "leave") { leaveRoom(""); return; }
    else if (a === "copy") {
      var done = function (ok) { b.textContent = ok ? "Link copiado" : "Copia el código: " + app.code; };
      try { navigator.clipboard.writeText(location.href).then(function () { done(true); }, function () { done(false); }); } catch (x) { done(false); }
      return;
    }
    save(); refresh();
  });

  /* ---------- boot ---------- */
  function boot(saved) {
    load();
    if (saved && typeof saved.ch === "number") { cfg.ch = saved.ch; cfg.rivals = saved.rivals || cfg.rivals; cfg.stage = saved.stage || 0; }
    document.getElementById("btn-mute").textContent = cfg.mute ? "Sin sonido" : "Sonido";
    var hm = /^#([A-Za-z]{4})$/.exec(location.hash || "");
    if (hm) joinCode = hm[1].toUpperCase();
    renderMenu();
    raf = requestAnimationFrame(loop);
    if (document.fonts && document.fonts.load) document.fonts.load('20px "Bowlby One"').catch(function () {});
  }
  window.__madrazos = { app: app, faces: function () { return faces; }, state: function () { return G; }, step: function (n) { for (var i = 0; i < n && G; i++) step(); }, held: held };
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { ch: cfg.ch, rivals: cfg.rivals, stage: cfg.stage }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
